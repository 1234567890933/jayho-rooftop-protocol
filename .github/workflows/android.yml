name: Build Rooftop Protocol APK

# Bakes the assets from the generators, compiles the APK with the Android
# build-tools (no Gradle), signs it, and publishes it as a GitHub Release so
# there is one permanent download URL.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      profile:
        description: "Asset profile: standard (~155 MB) or max (~400 MB)"
        required: false
        default: max

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python imaging deps
        run: pip install --quiet numpy pillow

      # Install the SDK by hand: the marketplace action kept failing on the
      # runner image, and these are the exact steps that build locally.
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls "$SDK/platforms/android-34/android.jar"
          ls "$SDK/build-tools/34.0.0/aapt2"

      - name: Bake assets
        run: |
          set -euo pipefail
          chmod +x tools/make_assets.sh android/tools/build_apk.sh
          tools/make_assets.sh "${{ github.event.inputs.profile || 'max' }}"

      - name: Build and sign the APK
        run: |
          set -euo pipefail
          android/tools/build_apk.sh
          mkdir -p dist
          cp android/build/RooftopProtocol.apk "dist/RooftopProtocol-${GITHUB_SHA::7}.apk"
          ls -lh dist

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RooftopProtocol-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish a release with a permanent download URL
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Rooftop Protocol 1.2.${{ github.run_number }}
          body: |
            Gyro aim engine, stability pass, max asset profile.

            Install: copy the APK to the phone, tap it, allow install from this source.
          files: dist/*.apk
